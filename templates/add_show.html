<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Show - Movie Ticket Management</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

    <!-- ==============================
         ADMIN NAVBAR
    =============================== -->

    <nav class="navbar">

        <div class="nav-logo">
            Movie Ticket Management
        </div>

        <div class="nav-links">

            <a href="/admin">
                Dashboard
            </a>

            <a href="/admin/screens">
                Manage Screens
            </a>

            <a href="/admin/logout">
                Logout
            </a>

        </div>

    </nav>


    <!-- ==============================
         MAIN CONTENT
    =============================== -->

    <main class="admin-container">

        <div class="admin-header">

            <h1>
                Add New Show
            </h1>

            <p>
                Create a new movie show using a managed theatre screen.
            </p>

        </div>


        <!-- ==============================
             FORM
        =============================== -->

        <div class="admin-card">

            <form
                method="POST"
                action="/admin/add-show"
            >

                <!-- CSRF Protection -->

                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ csrf_token() }}"
                >


                <!-- MOVIE -->

                <div class="form-group">

                    <label for="movie_id">
                        Movie
                    </label>

                    <select
                        id="movie_id"
                        name="movie_id"
                        required
                    >

                        <option value="">
                            -- Select Movie --
                        </option>

                        {% for movie in movies %}

                            <option value="{{ movie['id'] }}">

                                {{ movie['title'] }}

                            </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- SCREEN -->

                <div class="form-group">

                    <label for="screen_id">
                        Theatre / Screen
                    </label>

                    <select
                        id="screen_id"
                        name="screen_id"
                        required
                    >

                        <option value="">
                            -- Select Theatre / Screen --
                        </option>

                        {% for screen in screens %}

                            <option value="{{ screen['id'] }}">

                                {{ screen['theatre'] }}
                                —
                                {{ screen['screen_name'] }}
                                ({{ screen['capacity'] }} seats)

                            </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- SHOW DATE -->

                <div class="form-group">

                    <label for="show_date">
                        Show Date
                    </label>

                    <input
                        type="date"
                        id="show_date"
                        name="show_date"
                        required
                    >

                </div>


                <!-- SHOW TIME -->

                <div class="form-group">

                    <label for="show_time">
                        Show Time
                    </label>

                    <input
                        type="time"
                        id="show_time"
                        name="show_time"
                        required
                    >

                </div>


                <!-- PRICE -->

                <div class="form-group">

                    <label for="price">
                        Ticket Price (₹)
                    </label>

                    <input
                        type="number"
                        id="price"
                        name="price"
                        min="1"
                        max="10000"
                        step="0.01"
                        placeholder="Example: 180"
                        required
                    >

                </div>


                <!-- BUTTONS -->

                <div class="form-actions">

                    <button
                        type="submit"
                        class="admin-primary-button"
                    >
                        Add Show
                    </button>

                    <a
                        href="/admin"
                        class="admin-secondary-button"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </main>


    <!-- ==============================
         FOOTER
    =============================== -->

    <footer class="site-footer">

        <p>
            © 2026 Movie Ticket Management System
        </p>

    </footer>

</body>

</html>
